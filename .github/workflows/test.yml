name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # actions pinned to release commits (v7.0.1, v7.1.0, v6.1.0)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Unit tests (balances, splits, settle-up, filters, recurrence, alert planning)
        run: npm test
      - name: Security Rules tests and alert-job sweep (Firestore emulator)
        run: npm run test:rules
