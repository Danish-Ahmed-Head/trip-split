name: background-alerts

# Free replacement for Cloud Functions: looks for new "something happened"
# markers in Firestore and sends the matching alerts through Firebase Cloud
# Messaging (free).
#
# Triggers:
#   - workflow_dispatch: called every 5 minutes by the free Cloudflare Worker in
#     cloudflare/ (GitHub's own scheduler runs hourly jobs hours late, so it is
#     only the backup here).
#   - schedule: hourly backup, off the top of the hour where GitHub is busiest.
#
# Needs one repository secret: FIREBASE_SERVICE_ACCOUNT (service-account JSON).
# Without it the job exits cleanly and does nothing.

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print what would be sent without sending or marking events done"
        type: boolean
        default: false

concurrency:
  group: background-alerts
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sweep:
    if: github.repository == 'Danish-Ahmed-Head/trip-split'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # actions pinned to release commits (v7.0.1, v7.1.0)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev
      - name: Send pending alerts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: node scripts/send-push.mjs
